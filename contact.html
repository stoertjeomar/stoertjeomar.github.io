<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>contact - Omar</title>
</head>
<body>
    <header>
        <h1>contact</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Wie is Omar?</a></li>
            <li><a href="projecten.html">Projecten</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <main>
        <form id="contact-form" novalidate>
            <label for="naam">Naam:</label>
            <input id="naam" required minlength="2" aria-describedby="naam-error" aria-invalid="false">
            <span id="naam-error" role="alert"></span>

            <label for="email">Email:</label>
            <input id="email" type="email" required aria-describedby="email-error" aria-invalid="false">
            <span id="email-error" role="alert"></span>

            <label for="bericht">Bericht:</label>
            <textarea id="bericht" required minlength="10" aria-describedby="bericht-error" aria-invalid="false"></textarea>
            <span id="bericht-error" role="alert"></span>

            <button type="submit">Verstuur</button>
            <div id="form-status" aria-live="polite"></div>
        </form> 
        <section id ="weer">
        <h2>Het weer in denhaag</h2>
        <p id="weer-status"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Omar Moussaten</p>
    </footer>
    <script src="contact.js"></script>
    <script src="weer.js"></script>
</body>
</html>
